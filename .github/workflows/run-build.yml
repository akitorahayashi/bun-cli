# Build Workflow
#
# Compiles the Bun CLI into a standalone executable.

name: Run Build

on:
  workflow_call:
    inputs:
      release_id:
        required: false
        type: string

permissions:
  contents: read

jobs:
  run-build:
    name: Run Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Development Environment
        uses: ./.github/actions/setup

      - name: Build Bun CLI
        run: bun run build

      - name: Prepare Release Asset
        if: inputs.release_id != ''
        run: |
          cp dist/bun-cli bun-cli-linux-x64
          chmod +x bun-cli-linux-x64

      - name: Upload Release Asset
        if: inputs.release_id != ''
        uses: akitorahayashi/gh-release@v1
        with:
          mode: upload
          token: ${{ github.token }}
          release_id: ${{ inputs.release_id }}
          files: bun-cli-linux-x64
          overwrite: true
