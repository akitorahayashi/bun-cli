# Build Workflow
#
# Bundles the Bun CLI into a Bun-targeted JavaScript file.

name: Run Build

on:
  workflow_call:

jobs:
  build:
    name: Build
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Development Environment
        uses: ./.github/actions/setup

      - name: Build Bun CLI
        run: bun run build
